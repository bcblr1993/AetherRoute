mode: rule
log-level: warning
ipv6: false
dns:
  enable: false
proxies:
  - name: Hysteria2 Interop
    type: hysteria2
    server: 127.0.0.1
    port: 59007
    password: hy2-password
    sni: localhost
    skip-cert-verify: true
proxy-groups:
  - name: AetherRoute Interop
    type: select
    proxies:
      - Hysteria2 Interop
rules:
  - MATCH,AetherRoute Interop
