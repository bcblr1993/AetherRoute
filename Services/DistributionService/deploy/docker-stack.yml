version: "3.8"

networks:
  backend:
    driver: overlay
    internal: true
  proxy:
    external: true

services:
  signer:
    image: ${AETHERROUTE_DISTRIBUTION_IMAGE:?set an immutable release image tag}
    user: "10001:12000"
    read_only: true
    init: true
    entrypoint: ["/bin/setpriv"]
    command:
      - --no-new-privs
      - /usr/local/bin/aetherroute-signer-entrypoint
      - -product-id
      - com.aetherroute.desktop
      - -seed
      - /run/secrets/signing-seed.raw
      - -socket
      - /run/aetherroute/receipt-signer.sock
      - -socket-group
      - aetherroute-service
    cap_drop:
      - ALL
    networks:
      - backend
    volumes:
      - ${AETHERROUTE_SIGNER_SEED:?set signer seed path}:/run/secrets/signing-seed.raw:ro
      - ${AETHERROUTE_RUNTIME_ROOT:?set private runtime directory}:/run/aetherroute
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 4194304
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/aetherroute/receipt-signer.sock"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 60s
      resources:
        limits:
          cpus: "0.15"
          memory: 32M
        reservations:
          memory: 8M
      placement:
        constraints:
          - node.role == manager

  web:
    image: ${AETHERROUTE_DISTRIBUTION_IMAGE:?set an immutable release image tag}
    user: "10002:12000"
    read_only: true
    init: true
    cap_drop:
      - ALL
    environment:
      AETHERROUTE_PRODUCT_ID: com.aetherroute.desktop
      AETHERROUTE_STATE_PATH: /var/lib/aetherroute/licenses.json
      AETHERROUTE_PEPPER_PATH: /run/secrets/license-pepper.raw
      AETHERROUTE_PUBLIC_KEY_PATH: /run/config/signing-public.raw
      AETHERROUTE_UPDATE_ENVELOPE_PATH: /run/config/current.update.json
      AETHERROUTE_SIGNER_SOCKET_PATH: /run/aetherroute/receipt-signer.sock
    networks:
      - backend
      - proxy
    volumes:
      - ${AETHERROUTE_LICENSE_STATE_ROOT:?set private state directory}:/var/lib/aetherroute
      - ${AETHERROUTE_RUNTIME_ROOT:?set private runtime directory}:/run/aetherroute:ro
      - ${AETHERROUTE_LICENSE_PEPPER:?set license pepper path}:/run/secrets/license-pepper.raw:ro
      - ${AETHERROUTE_PUBLIC_KEY:?set public key path}:/run/config/signing-public.raw:ro
      - ${AETHERROUTE_UPDATE_ENVELOPE:?set signed update envelope path}:/run/config/current.update.json:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 8388608
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: _aetherroute_internal_health", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        delay: 3s
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 5
        window: 60s
      resources:
        limits:
          cpus: "0.30"
          memory: 64M
        reservations:
          memory: 12M
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=proxy"
        - "traefik.swarm.network=proxy"
        - "traefik.http.services.aetherroute-license-staging.loadbalancer.server.port=8080"
        - "traefik.http.routers.aetherroute-license-staging.entrypoints=websecure"
        - "traefik.http.routers.aetherroute-license-staging.rule=Host(`license-staging.baizhiedu.xin`)"
        - "traefik.http.routers.aetherroute-license-staging.service=aetherroute-license-staging"
        - "traefik.http.routers.aetherroute-license-staging.tls=true"
        - "traefik.http.routers.aetherroute-license-staging.tls.certresolver=ali"
