<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AetherRoute</title>
  <desc id="desc">An open portal with a rising private route.</desc>
  <defs>
