  <path d="M82 31C68 22 47 24 36 36c-15 17-12 42 4 55 15 12 39 9 49-7 3-4 5-9 5-14" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="12" stroke-linecap="round"/>
