worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 30;
    client_max_body_size 64k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    map $sent_http_content_type $immutable_assets {
        default "";
        text/css "public, max-age=0, must-revalidate";
        application/javascript "public, max-age=0, must-revalidate";
        image/svg+xml "public, max-age=0, must-revalidate";
        image/png "public, max-age=0, must-revalidate";
    }

    server {
        listen 8080 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 8080;
        server_name aetherroute.baizhiedu.xin;
        root /srv/site;
        index index.html;
        charset utf-8;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control $immutable_assets always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    server {
        listen 8080;
        server_name downloads.baizhiedu.xin;
        root /srv/downloads;
        charset utf-8;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            limit_except GET { deny all; }
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    server {
        listen 8080;
        server_name updates.baizhiedu.xin;
        root /srv/updates;
        charset utf-8;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/update {
            limit_except GET { deny all; }
            default_type application/json;
            try_files /current.update.json =404;
            add_header Cache-Control "no-store, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / { return 404; }
    }
}
