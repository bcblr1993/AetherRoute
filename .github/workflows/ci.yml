name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Services/DistributionService/go.mod
          cache-dependency-path: Services/DistributionService/go.mod
      - name: Run repository checks
        run: ./scripts/test_repository_ci.sh
