name: Repository CI

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Services/DistributionService/go.mod
          cache-dependency-path: Services/DistributionService/go.mod
      - name: Install repository check dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ripgrep
      - name: Run repository checks
        run: ./scripts/test_repository_ci.sh

  product:
    name: App, extensions and Swift regression tests
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out source and pinned core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: false
      - name: Initialize the pinned core explicitly
        run: git submodule update --init --checkout --recursive
      - name: Install product check dependencies
        run: |
          brew install ripgrep jq
          cargo install --locked cargo-about --version 0.9.1
      - name: Build both embedded cores
        run: |
          rustup target add aarch64-apple-darwin
          ./scripts/build_core.sh
          ./scripts/build_direct_core.sh
          ./scripts/generate_licenses.sh
      - name: Build product and run Swift tests
        run: ./scripts/test_product_build.sh
      - name: Run source-built latency regression
        run: sh Tests/ProxyLatencyMeasurement/run.sh
