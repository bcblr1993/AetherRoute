name: Repository CI

# Release-gated. These checks run on macOS runners, which bill at ten times the
# Linux rate, so they fire only for an actual release tag (v1.0.1-build-2026091302
# and friends) or when someone asks for them by hand. Ordinary commits to main
# are guarded locally by scripts/test.sh instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: Services/DistributionService/go.mod
          cache-dependency-path: Services/DistributionService/go.mod
      - name: Install repository check dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install ripgrep
      - name: Run repository checks
        run: ./scripts/test_repository_ci.sh
