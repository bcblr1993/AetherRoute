name: Feature request
description: Propose a focused product improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: apple
    attributes:
      label: macOS design and accessibility considerations
  - type: textarea
    id: performance
    attributes:
      label: Performance, privacy, and network-safety considerations
