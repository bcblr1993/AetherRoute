name: Bug report
description: Report a reproducible AetherRoute defect without including secrets.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include subscription URLs, node credentials, activation keys, profiles, or Apple signing material.
  - type: input
    id: version
    attributes:
      label: Version and build
      placeholder: 0.1.0 (1)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS and Mac model
      placeholder: macOS 15.x, Apple M-series
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Network engine
      options:
        - Not connected / import only
        - Transparent Proxy
        - TUN
        - Both
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use redacted or synthetic configuration values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, subscription tokens, personal traffic data, and signing material.
          required: true
